<!-- housing/templates/housing/contact.html -->
{% extends 'housing/base.html' %} <!-- Assuming you have a base template -->

{% block content %}
<div class="max-w-xl mx-auto py-12 px-4">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Contact Us</h2>

        <!-- Display Success Messages -->
        {% if messages %}
        {% for message in messages %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline">{{ message }}</span>
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'housing:contact' %}" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                {{ form.name }}
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                {{ form.email }}
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                {{ form.message }}
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                Send Message
            </button>
        </form>
    </div>
</div>
{% endblock %}
