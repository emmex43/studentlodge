{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ house.title }} | Studentlodge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<!-- CHANGED: Added font-['Inter'] and text-gray-800 to the body -->
<body class="bg-gray-100 min-h-screen flex justify-center pb-12 font-['Inter'] text-gray-800">

    <!-- Main Mobile Container -->
    <div class="w-full max-w-md bg-white shadow-2xl min-h-screen relative overflow-hidden">

        <!-- 1. Sleek Navbar -->
        <div class="px-5 py-4 border-b border-gray-100 sticky top-0 bg-white/95 backdrop-blur-sm z-20 flex items-center justify-between">
            <a href="{% url 'housing:home_feed' %}" class="text-gray-600 hover:text-blue-600 transition flex items-center gap-2 text-sm font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back
            </a>        
          <img src="{% static 'images/logo.png' %}" alt="StudentLodge Logo" class="h-12 w-auto object-contain">
</div>

        <!-- 2. Immersive Video Player -->
        <div class="relative bg-gray-50 border-b border-gray-100 w-full aspect-[4/5] max-h-[550px] flex items-center justify-center">
            <video class="w-full h-full object-contain" controls preload="metadata" playsinline autoplay>
                <source src="{{ house.video.url }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

       <!-- 3. Enhanced Details Section -->
<div class="p-6">
    <div class="flex justify-between items-start mb-4 gap-4">
        <!-- CHANGED: Made the title text slightly larger and tighter -->
        <h1 class="text-3xl font-black text-gray-900 tracking-tight leading-tight">{{ house.title }}</h1>
        <span class="shrink-0 bg-blue-50 text-blue-700 text-sm font-bold px-4 py-2 rounded-lg border border-blue-100">
            {{ house.price }}
        </span>
    </div>

    <div class="flex items-center text-gray-500 mb-6 font-medium text-sm">
        <svg class="w-5 h-5 mr-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        {{ house.location }}
    </div>

    <!-- 4. Added Description -->
    <!-- CHANGED: Increased text size to text-base and softened the color -->
    <div class="text-base text-gray-600 mb-8 whitespace-pre-line leading-relaxed font-normal">
        {{ house.description }}
    </div>

            <!-- Enhanced WhatsApp Button -->
            <a href="https://wa.me/{{ house.agent_whatsapp }}?text=Hello,%20I%20saw%20your%20listing%20on%20studentlodge.ng:%20{{ house.title|urlencode }}%20in%20{{ house.location|urlencode }}%20for%20{{ house.price|urlencode }}.%20Is%20it%20still%20available?"
                target="_blank"
                class="w-full bg-[#25D366] hover:bg-[#1DA851] text-white font-bold text-lg py-4 px-4 rounded-xl flex items-center justify-center gap-3 transition duration-200 shadow-md hover:shadow-lg">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.663-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                </svg>
                Contact Agent on WhatsApp
            </a>
        </div>
    </div>
</body>
</html>
