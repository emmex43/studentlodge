<!-- housing/templates/account/login.html -->
{% extends "housing/base.html" %}
{% load socialaccount %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-gray-200 text-center">
        
        <!-- Header Section -->
        <div>
            <div class="mx-auto flex justify-center mb-4">
                <div class="h-12 w-12 bg-blue-50 rounded-full flex items-center justify-center">
                    <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>
            <h2 class="mt-2 text-2xl sm:text-3xl font-bold text-gray-900">
                Sign in to continue
            </h2>
            <p class="mt-3 text-sm text-gray-500">
                Securely log in to save your favorite student accommodations and access them from any device.
            </p>
        </div>
        
        <!-- Google Auth Button -->
        <div class="mt-8">
            <a href="{% provider_login_url 'google' %}" class="flex justify-center items-center w-full bg-white border border-gray-300 rounded-xl px-4 py-3.5 font-semibold text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
                <svg width="22" height="22" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mr-3">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                Continue with Google
            </a>
        </div>
        
        <!-- Back Navigation -->
        <div class="mt-6">
            <a href="{% url 'housing:home_feed' %}" class="text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors">
                &larr; Back to properties
            </a>
        </div>
    </div>
</div>
{% endblock %}
